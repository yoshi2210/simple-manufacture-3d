name: ci
on:
  push:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pyflakes usd-core numpy
      - name: lint
        run: |
          python -m pyflakes isaac tools
          node --input-type=module --check < web/main.js
      - name: robot IK from USD joints
        run: python tests/test_usd_arm.py
      - name: data checks (BOM / BOP)
        run: python tests/test_plant_data.py
      - name: smoke test (real OpenUSD, stubbed Isaac runtime, synthetic SimReady robots)
        run: python tests/smoke_build.py
      - name: mini4wd data checks (regulation, takt, capacity, cost roll-up)
        run: python mini4wd/tests/test_company_data.py
      - name: mini4wd build is reproducible and parses
        run: |
          python mini4wd/web/build.py
          node --input-type=module --check < mini4wd/web/main.js
          git diff --exit-code mini4wd/web/index.html
  simready-real:
    # downloads the 45 pinned SimReady packages and builds the plant on the REAL assets (usd-core, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt usd-core numpy
      - name: fetch SimReady packages
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: python tools/fetch_simready.py
      - name: inspect real assets and robots
        run: python tests/real_assets_check.py
      - name: build the plant on real assets
        if: always()
        env: { SMOKE_MANIFEST: assets/simready/manifest.json }
        run: |
          set -o pipefail
          python tests/smoke_build.py 2>&1 | tee smoke-real.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simready-real
          path: |
            simready-real-report.md
            smoke-real.log
            assets/simready/manifest.json
