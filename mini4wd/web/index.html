<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>VELO-32 設計開発事務所＆製造ライン — デジタルツイン</title>
<style>
:root{--bg:#0e1115;--bg2:#151a21;--panel:rgba(18,22,29,.86);--line:rgba(255,255,255,.09);--txt:#e8ecf1;--mut:#909aa6;--acc:#ff8a3d;--blue:#3987e5;--ok:#3ddc84;--warn:#fab219;--bad:#ff5a52;--srf:#1b2129}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;overflow:hidden;font-size:13px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px}
button{font:inherit;font-size:12px;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:7px 10px;white-space:nowrap;cursor:pointer}
button.on{background:var(--acc);color:#111;border-color:transparent;font-weight:700}
select,input[type=range]{font:inherit;color:var(--txt);background:#222832;border:1px solid var(--line);border-radius:8px;padding:5px}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#0e1115f2,#0e1115cc);border-bottom:1px solid var(--line)}
#brand{display:flex;flex-direction:column;line-height:1.15;min-width:max-content}
#brand b{font-size:13px;letter-spacing:.04em}#brand span{font-size:10px;color:var(--mut)}
#tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1}#tabs::-webkit-scrollbar{display:none}
.live{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#d7262e;color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
/* campus HUD */
#hud{position:fixed;left:10px;top:62px;z-index:10;padding:9px 11px;width:292px}
#hud h3{margin:0 0 6px;font-size:11px;color:var(--mut);letter-spacing:.06em;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}.kv span{color:var(--mut);white-space:nowrap}.kv b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
#ticker{position:fixed;left:10px;bottom:64px;z-index:10;width:min(470px,calc(100vw - 20px));padding:8px 10px;font-size:11.5px;max-height:162px;overflow:hidden}
#ticker div{display:flex;gap:7px;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ticker i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:4px}
#ticker em{font-style:normal;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
#cams{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:10;display:flex;gap:5px;padding:6px;overflow-x:auto;max-width:calc(100vw - 16px);scrollbar-width:none}#cams::-webkit-scrollbar{display:none}
.label{position:fixed;left:0;top:0;pointer-events:none;font-size:11px;font-weight:600;color:#fff;background:rgba(10,12,16,.74);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);z-index:4}
.label.dept{pointer-events:auto;cursor:pointer;background:rgba(57,135,229,.85);border:none}
.label.small{font-size:10px;background:rgba(255,138,61,.88);color:#111;border:none}
/* design studio */
#ds{position:fixed;inset:56px 0 0 0;z-index:8;pointer-events:none;display:none}
#ds.show{display:block}
#dsL,#dsR{position:absolute;top:8px;bottom:8px;width:300px;pointer-events:auto;overflow:auto;padding:10px}
#dsL{left:8px}#dsR{right:8px;width:330px}
#dsBar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;pointer-events:auto;display:flex;gap:6px;align-items:center;padding:7px 10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 680px)}
.sec{font-size:10.5px;color:var(--mut);letter-spacing:.06em;margin:10px 0 4px;font-weight:600;text-transform:none}
.bomrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer;align-items:center}
.bomrow:hover{background:rgba(255,255,255,.05)}.bomrow.sel{background:rgba(255,138,61,.2)}
.bomrow small{color:var(--mut);font-size:10px;display:block}
.tag{font-size:9.5px;border-radius:5px;padding:0 5px;line-height:16px;white-space:nowrap}
.tag.in{background:rgba(57,135,229,.22);color:#8cbcf5}.tag.buy{background:rgba(255,255,255,.08);color:var(--mut)}
.tag.cc{background:rgba(255,90,82,.2);color:#ff9a93}.tag.sc{background:rgba(250,178,25,.2);color:#ffd27a}
.card{font-size:12px;line-height:1.55}.card h2{font-size:15px;margin:0 0 2px}.card .pn{color:var(--mut);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:11.5px}td,th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:10.5px;white-space:nowrap;position:sticky;top:0;background:var(--srf)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;font-size:12px}.chk em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut)}
.ok{color:var(--ok)}.ng{color:var(--bad)}.wa{color:var(--warn)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.st.s-ok{background:rgba(61,220,132,.16);color:#7ee8ac}.st.s-run{background:rgba(57,135,229,.2);color:#8cbcf5}.st.s-warn{background:rgba(250,178,25,.18);color:#ffd27a}.st.s-bad{background:rgba(255,90,82,.2);color:#ff9a93}.st.s-none{background:rgba(255,255,255,.07);color:var(--mut)}
/* full pages */
.page{position:fixed;inset:56px 0 0 0;z-index:15;overflow:auto;background:var(--bg);display:none;padding:16px 18px 60px}
.page.show{display:block}
.page h1{font-size:18px;margin:4px 0 2px}.page .lead{color:var(--mut);margin:0 0 14px;max-width:980px;line-height:1.6}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.box{background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box h2{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px}.box h2 small{color:var(--mut);font-weight:500;font-size:11px}
.wide{grid-column:1/-1}.scroll{overflow:auto;max-height:520px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi span{color:var(--mut);font-size:11px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}.kpi em{font-style:normal;font-size:11px;color:var(--mut)}
svg text{font-family:inherit}
#cfdWrap{display:grid;grid-template-columns:1fr 330px;gap:12px}
#cfdCanvas{width:100%;image-rendering:pixelated;border-radius:10px;background:#0b0d10;display:block}
#load{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--bg);color:var(--mut)}#load b{color:var(--txt)}
.disc{font-size:10.5px;color:var(--mut);line-height:1.5}
.vs{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.vs .step{flex:none;width:132px;background:#20262f;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:11px;position:relative}
.vs .step b{display:block;font-size:11.5px;margin-bottom:2px}.vs .step small{color:var(--mut);display:block}
.vs .step .wip{position:absolute;right:6px;top:5px;font-size:10px;color:var(--acc);font-variant-numeric:tabular-nums}
.dept{background:#20262f;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.dept h3{margin:0 0 3px;font-size:13px;display:flex;justify-content:space-between}.dept h3 span{color:var(--mut);font-weight:500;font-size:11px}
.dept p{margin:0 0 5px;color:var(--mut);font-size:11px}
#deptModal{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:80vh;overflow:auto;padding:14px 16px;display:none}#deptModal.show{display:block}
@media (max-width:820px){
  #hud{width:auto;right:10px;top:58px;padding:7px 9px}#hud .opt{display:none}
  #ticker{bottom:60px;max-height:84px;font-size:10.5px}
  #ds{inset:56px 0 0 0}#dsL{display:none}#dsR{top:auto;bottom:0;left:0;right:0;width:auto;height:44vh;border-radius:12px 12px 0 0}
  #dsBar{top:6px;bottom:auto;max-width:calc(100vw - 16px)}
  #cfdWrap{grid-template-columns:1fr}
  .page{padding:12px 10px 60px}
}
</style>

function computeCG(car) {
  const acc = V(0, 0, 0); let mass = 0;
  for (const p of D.parts) {
    const pn = p.pn === 'VW-BDY-110' ? BODY[curVar.body].pn : p.pn, g = car.groups[pn]; if (!g || p.ship_only) continue;
    const b = new THREE.Box3().setFromObject(g); if (b.isEmpty()) continue;
    const w = p.weight_g * p.qty; acc.addScaledVector(b.getCenter(V(0, 0, 0)), w); mass += w;
  }
  if (car.groups.BATTERY.visible) { const b = new THREE.Box3().setFromObject(car.groups.BATTERY), w = DESN.battery_mass_g * DESN.battery_count; acc.addScaledVector(b.getCenter(V(0, 0, 0)), w); mass += w; }
  return { p: acc.multiplyScalar(1 / mass), mass };
}

// ---------------------------------------------------------------- part cost roll-up (identical to tests/test_company_data.py)
const COST = (() => {
  const mrate = D.molding_rate_yen_h;
  function molded(p) {
    const mat = p.weight_g * (1 + p.runner_ratio) / 1000 * p.resin_yen_kg;
    const ton = String(D.molding.find(m => m.id === p.machine).tonnage);
    const machine = mrate[ton] * p.cycle_s / 3600 / p.cavities;
    const mold = p.mold_cost ? p.mold_cost / p.mold_life_shots / p.cavities : 0;
    return { total: mat + machine + mold, mat, machine, mold };
  }
  function unit(p) {
    if (p.make_buy === '購入') return { total: p.unit_cost, buy: p.unit_cost };
    if (p.smt) { const comp = D.pcb_bom.reduce((s, c) => s + c.cost * c.qty, 0), proc = D.smt.line_rate_yen_h * D.smt.panel_cycle_s / 3600 / D.smt.panel_up; return { total: comp + proc, comp, proc }; }
    if ('machine_rate' in p) { const proc = p.machine_rate * p.cycle_s / 3600; return { total: p.sheet_yen + proc, sheet: p.sheet_yen, proc }; }
    return molded(p);
  }
  const lines = D.parts.map(p => ({ p, u: unit(p), ext: unit(p).total * p.qty }));
  const material = lines.reduce((s, l) => s + l.ext, 0), cm = D.cost_model, a = D.assembly;
  const labor = (a.line_rate_yen_h + a.operator_rate_yen_h * a.operators) * TAKT / 3600;
  const overhead = (material + labor) * cm.overhead_rate, total = material + labor + overhead + cm.logistics_per_unit + cm.warranty_per_unit;
  const vave = D.vave.reduce((s, v) => s + v.saving, 0);
  const net = v => v.msrp / (1 + cm.tax_rate) * (1 - cm.channel_margin);
  return { unit, lines, material, labor, overhead, total, vave, after: total - vave, net, cm, byPn: Object.fromEntries(lines.map(l => [l.p.pn, l])) };
})();

function ap({ S, O, D: Dt }) {   // AIAG-VDA FMEA Action Priority (Handbook 2019, simplified table)
  if (S >= 9) { if (O >= 6) return 'H'; if (O >= 4) return Dt >= 2 ? 'H' : 'M'; if (O >= 2) return Dt >= 7 ? 'H' : Dt >= 5 ? 'M' : 'L'; return 'L'; }
  if (S >= 7) { if (O >= 8) return 'H'; if (O >= 6) return Dt >= 2 ? 'H' : 'M'; if (O >= 4) return Dt >= 7 ? 'H' : 'M'; if (O >= 2) return Dt >= 5 ? 'M' : 'L'; return 'L'; }
  if (S >= 4) { if (O >= 8) return Dt >= 5 ? 'H' : 'M'; if (O >= 6) return Dt >= 2 ? 'M' : 'L'; if (O >= 4) return Dt >= 7 ? 'M' : 'L'; return 'L'; }
  if (S >= 2) return O >= 8 && Dt >= 5 ? 'M' : 'L';
  return 'L';
}
const apTag = f => { const a = ap(f); return `<span class="st ${a === 'H' ? 's-bad' : a === 'M' ? 's-warn' : 's-ok'}">${a === 'H' ? 'H 高' : a === 'M' ? 'M 中' : 'L 低'}</span>`; };
function cpk(c) { const up = (c.usl - c.mean) / (3 * c.sd); return c.lsl == null ? up : Math.min(up, (c.mean - c.lsl) / (3 * c.sd)); }

function gantt() {
  const W = 1100, rowH = 30, top = 34, L = 150, ph = D.apqp, H = top + ph.length * rowH + 64, x = w => L + (w - 1) / 52 * (W - L - 16);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:760px" role="img" aria-label="APQP 日程">`;
  for (let w = 1; w <= 52; w += 4) s += `<line x1="${x(w)}" x2="${x(w)}" y1="${top - 6}" y2="${H - 50}" stroke="rgba(255,255,255,.06)"/><text x="${x(w)}" y="${top - 12}" font-size="10" fill="#909aa6" text-anchor="middle">W${w}</text>`;
  ph.forEach((p, i) => {
    const y = top + i * rowH, done = p.end < NOW, act = p.start <= NOW && p.end >= NOW;
    s += `<text x="8" y="${y + 19}" font-size="12" fill="#e8ecf1">${p.id} ${esc(p.name)}</text>`;

function mrp(item) {
  const M_ = D.mrp, n = M_.weeks, rows = { gross: [], sched: [], poh: [], por: [], rel: Array(n).fill(0) }, exc = [];
  let oh = item.on_hand;
  for (let w = 0; w < n; w++) {
    const gross = Math.round(M_.demand[w] * item.per * 1000) / 1000, sch = +(item.receipts[String(w)] || 0);
    oh += sch - gross; let por = 0;
    if (oh < item.safety) { por = Math.ceil((item.safety - oh) / item.lot) * item.lot; oh += por; const rw = w - item.lead_w; if (rw < 0) exc.push(`W${M_.start_week + w} 受入分は発注期限 W${M_.start_week + rw} を過ぎています → 緊急手配・分納交渉`); else rows.rel[rw] += por; }
    rows.gross.push(gross); rows.sched.push(sch); rows.poh.push(oh); rows.por.push(por);
  }
  rows.rel.forEach((q, w) => { if (q && w === 0) exc.push(`今週（W${M_.start_week}）発注が必要：${q.toLocaleString()}`); });
  return { rows, exc };
}

  const r = BIZ.r(), pick = a => a[Math.floor(BIZ.r() * a.length)];
  BIZ.next = 2.2 + BIZ.r() * 2.8;

// ============================================================ simulation state & update
const SIM = { t: 40 * CYC + 1, frame: 0, done: 0, fails: 0 };
const PHASE = D.apqp.find(p => p.start <= NOW && p.end >= NOW) || D.apqp.at(-1);
document.getElementById('hScale').textContent = SCALE;
document.getElementById('hTakt').textContent = `${TAKT} s（デモ ${CYC.toFixed(1)} s）`;
document.getElementById('hPhase').textContent = `${PHASE.id} ${PHASE.name} · W${NOW}`;
const hash = n => { let x = (n * 2654435761) >>> 0; x ^= x >>> 15; x = Math.imul(x, 2246822519) >>> 0; x ^= x >>> 13; return (x >>> 0) / 4294967296; };
const BODY_PNS = new Set(D.bodies.map(b => b.pn));
const tmpV = V(0, 0, 0), tmpV2 = V(0, 0, 0);
const MOVE = 0.18;                                    // fraction of the cycle used for indexing
let lastPack = -1;

function updateLine(t) {
  const C = Math.floor(t / CYC), u = t / CYC - C, mv = smooth(u / MOVE), dwell = clamp((u - MOVE - 0.02) / (1 - MOVE - 0.04), 0, 1);
  for (const pool of Object.values(POOL)) for (const c of pool) c.root.visible = false;
  const used = Object.fromEntries(VARIANTS.map(v => [v.id, 0]));
  for (let i = 0; i < LINE_N; i++) {
    const s = C - i; if (s < 0) continue;
    const vid = MIX[s % MIX.length], car = POOL[vid][used[vid]++], body = BODY[VAR[vid].body].pn;
    car.root.visible = true;
    const x = u < MOVE ? stX(i - 1) + ASM.sp * mv : stX(i);
    car.root.position.set(x, ASM.y + 0.01, ASM.z); car.root.rotation.set(0, 0, 0);
    // which parts are on the car: stations < i, plus station i once the robot has placed (or the operator fitted) them
    const placed = u >= MOVE && dwell > 0.7;
    for (const [pn, g] of Object.entries(car.groups)) g.visible = false;
    for (let k = 0; k <= i; k++) {
      if (k === i && !placed) continue;
      for (let pn of STATION_PARTS[k]) { if (pn === 'VW-BDY-110') pn = body; const g = car.groups[pn]; if (g) g.visible = true; }
    }
    if (ASM.stations[i].id === 'A80' && u >= MOVE) car.root.position.y += Math.sin(dwell * Math.PI) * 0.004;   // dyno lift
    if (ASM.stations[i].id === 'A90' && dwell > 0.55) car.root.visible = false;                           // into the case
  }
  // robots
  for (const { rb, i } of ROBOTS) {
    const s = C - i, active = s >= 0 && u >= MOVE, ur = active ? dwell : 0;
    const place = tmpV2.set(stX(i), ASM.y + 0.058, ASM.z);
    pp(ur, rb.home, rb.pick, place, tmpV); rb.reach(tmpV);
    rb.carry.visible = active && ur > 0.24 && ur < 0.7;
  }
  // EOL
  const eolActive = C - 7 >= 0 && u >= MOVE;
  for (const r of EOL_ROLLERS) r.rotation.y += eolActive ? 0.9 : 0;
  // packed cases on the outfeed
  for (let k = 0; k < BOXES.length; k++) {
    const s = C - 8 - k; const b = BOXES[k];
    if (s < 0) { b.visible = false; continue; }
    const age = (t - (s + 8) * CYC - CYC * 0.6) / CYC;          // cycles since packing
    if (age < 0) { b.visible = false; continue; }
    const x = OUTFEED.x0 + age * 0.9; b.visible = x < OUTFEED.x1; b.position.set(Math.min(x, OUTFEED.x1), ASM.y + 0.045, ASM.z);
  }
  const done = Math.max(0, C - 8 + (u > 0.6 ? 1 : 0));
  if (done !== SIM.done) {
    for (let s = SIM.done; s < done; s++) { if (hash(s + 11) < 0.016) { SIM.fails++; event('MFG', `EOL NG S/N VX${String(s + 1).padStart(6, '0')} 待機電流 ${(26 + hash(s) * 4).toFixed(1)} µA > 25 µA → 修理工程（基板交換）`); } else if (s % 6 === 0) event('MFG', `完成 S/N VX${String(s + 1).padStart(6, '0')} ${VAR[MIX[s % MIX.length]].name}（EOL 最高速 ${(trackSpeed(VAR[MIX[s % MIX.length]]).vmax * 3.6 * (0.98 + hash(s) * 0.04)).toFixed(1)} km/h・合格）`); }
    SIM.done = done;
  }
  PALLET_STACK.scale.y = Math.max(0.001, (done % 48) / 48); PALLET_STACK.position.y = 0.15 + PALLET_STACK.scale.y / 2;
  // EOL screen (every cycle)
  if (C !== lastPack) {
    lastPack = C; const s = C - 7, cv = eolScreen.material.map.image, g = cv.getContext('2d');
    g.fillStyle = '#0b0e12'; g.fillRect(0, 0, cv.width, cv.height);
    if (s >= 0) {
      const v = VAR[MIX[s % MIX.length]], sp = trackSpeed(v).vmax * 3.6 * (0.98 + hash(s) * 0.04), ng = hash(s + 11) < 0.016;
      g.fillStyle = '#909aa6'; g.font = '16px monospace'; g.fillText(`EOL  VX${String(s + 1).padStart(6, '0')}`, 12, 26);
      g.fillStyle = '#e8ecf1'; g.font = 'bold 22px monospace'; g.fillText(`${sp.toFixed(1)} km/h`, 12, 60);
      g.font = '16px monospace'; g.fillText(`SS 120±10ms ${(118 + hash(s + 3) * 5).toFixed(0)}`, 12, 88); g.fillText(`Iq ${ng ? (26 + hash(s) * 4).toFixed(1) : (12 + hash(s + 5) * 6).toFixed(1)} uA`, 12, 112);
      g.fillStyle = ng ? '#ff5a52' : '#3ddc84'; g.font = 'bold 24px sans-serif'; g.fillText(ng ? 'NG' : 'OK', 190, 146);
    }
    eolScreen.material.map.needsUpdate = true;
  }
}
function updateMolding(t) {
  for (const m of MOLD) {
    const tt = t / m.cycle + m.phase, k = Math.floor(tt), u = tt - k;
    const close = u < 0.12 ? smooth(u / 0.12) : u < 0.72 ? 1 : u < 0.84 ? 1 - smooth((u - 0.72) / 0.12) : 0;
    const xo = m.x - m.L * 0.3, xc = m.x - m.L * 0.05 - 0.27; m.moving.position.x = lerp(xo, xc, close);
    m.lamp.material.emissive.setHex(u > 0.12 && u < 0.72 ? 0xfab219 : 0x33ff66);
    m.drops.forEach((d, j) => { const f = (u - 0.84 - j * 0.015) / 0.12; d.position.y = f > 0 && f < 1 ? lerp(1.35, 0.5, f * f) : -5; d.position.x = m.x - m.L * 0.23 + (j - 2.5) * 0.06; });
    m.fill.scale.y = 1 + (k % 40) * 4; m.fill.position.y = 0.45 + (k % 40) * 0.002;
  }
}
function updateSMT(t) {
  const n = D.smt.steps.length, per = D.smt.panel_cycle_s / SCALE, span = (SMT.x1 - SMT.x0) / n, travel = n * per;
  const k0 = Math.floor(t / per);
  SMT.boards.forEach((b, j) => {
    const k = k0 - j, age = t - k * per; b.visible = k >= 0 && age < travel;
    const st = Math.floor(age / per), f = age / per - st, x = SMT.x0 + span * (st + (f < 0.25 ? smooth(f / 0.25) : 1) - 0.5);
    b.position.set(x, SMT.y + 0.03, SMT.z);
  });
  SMT.reflow.material.emissiveIntensity = 1.2 + Math.sin(t * 3) * 0.3;
  SMT.aoi.material.emissiveIntensity = (t / per) % 1 > 0.3 && (t / per) % 1 < 0.6 ? 2.2 : 0;
}
function updateMisc(t, dt) {
  PRINTERS.forEach(p => { const u = (t * 0.4 + p.ph) % 30 / 30; p.head.position.set(p.px + Math.sin(t * 7 + p.ph) * 0.3, 0.84 + u * 0.06, p.pz + Math.cos(t * 5.3 + p.ph) * 0.3); p.part.scale.y = 1 + u * 60; p.part.position.y = 0.81 + u * 0.03; });
  PRESSES.forEach(p => { const u = (t / CYC + p.ph) % 1; p.ram.position.y = 1.6 - (u > 0.4 && u < 0.6 ? Math.sin((u - 0.4) / 0.2 * Math.PI) * 0.45 : 0); });
  for (const a of AGVS) { const u = mod(t * 1.2 / a.len + a.off, 1), p = a.path.getPointAt(u), tg = a.path.getTangentAt(u); a.m.position.set(p.x, 0, p.z); a.m.rotation.y = Math.atan2(-tg.z, tg.x); }
  for (const w of WALKERS) { const d = w.a.distanceTo(w.b), ph = mod(t * w.sp / d + w.off, 2), f = ph < 1 ? ph : 2 - ph; w.m.position.lerpVectors(w.a, w.b, f); w.m.rotation.y = ph < 1 ? 0 : Math.PI; }
  // test course
  let board = false;
  for (const tc of TRACK_CARS) {
    const sp = trackSpeed(tc.v), u0 = tc.s / TRACK.L; tc.s += sp.avg * dt * (0.97 + 0.06 * Math.sin(t * 0.7 + tc.lane0));
    const laps = Math.floor(tc.s / TRACK.L - 0.22) + 1, lane = (tc.lane0 + laps) % 3;
    const lp = TRACK.at(tc.s, lane);
    tc.c.root.position.set(lp.x, lp.y + 0.002, lp.z); tc.c.root.rotation.y = lp.yaw;
    if (Math.floor(tc.s / TRACK.L) > Math.floor(u0)) { tc.laps++; if (tc.lapStart) tc.last = t - tc.lapStart; tc.lapStart = t; board = true; }
  }
  if (board) drawBoard();
}

// ============================================================ labels
const projV = V(0, 0, 0);
function updateLabels(cam) {
  const W = innerWidth, H = innerHeight;
  for (const l of labels) {
    if (l.view !== VIEW || l.el.dataset.hide) { if (l.el.style.display !== 'none') l.el.style.display = 'none'; continue; }
    projV.copy(l.p); if (l.obj) projV.applyMatrix4(l.obj.matrixWorld);
    const d = cam.position.distanceTo(projV); projV.project(cam);
    const vis = projV.z < 1 && Math.abs(projV.x) < 1.1 && Math.abs(projV.y) < 1.1 && d < l.maxDist;
    if (l === cgLabel) { if (!cgMark.visible) { l.el.style.display = 'none'; continue; } }
    else if (sLabels.includes(l) && !S.env) { l.el.style.display = 'none'; continue; }
    l.el.style.display = vis ? '' : 'none';
    if (vis) l.el.style.transform = `translate(-50%,-100%) translate(${((projV.x + 1) / 2 * W).toFixed(1)}px,${((1 - projV.y) / 2 * H).toFixed(1)}px)`;
  }
}

// ============================================================ main loop
function hudUpdate() {
  document.getElementById('hDone').textContent = `${SIM.done.toLocaleString()} 台`;
  document.getElementById('hFpy').textContent = SIM.done ? `${((1 - SIM.fails / SIM.done) * 100).toFixed(1)}%` : '—';
  document.getElementById('hOee').textContent = `${(86.4 + Math.sin(SIM.t / 40) * 1.3).toFixed(1)}%`;
  document.getElementById('hFg').textContent = `${(BIZ.fg + SIM.done).toLocaleString()} 台`;
  document.getElementById('hBl').textContent = `${BIZ.backlog.toLocaleString()} 台`;
}
LBM.setBody('STD');
SIM.done = Math.max(0, Math.floor(SIM.t / CYC) - 8);
buildStudioCar(VARIANTS[0]);
goCam(0, true);
const clockT = new THREE.Clock();
let paused = false;
function frame() {
  const dt = Math.min(clockT.getDelta(), 0.1);
  if (!paused) SIM.t += dt;
  const t = SIM.t; SIM.frame++;
  bizTick(paused ? 0 : dt);
  cfdTick(VIEW === 'cfd' ? 10 : 2);
  if (VIEW === 'campus') {
    if (tween) { tween.u = Math.min(1, tween.u + dt / 1.4); const f = smooth(tween.u); camera.position.lerpVectors(tween.p0, tween.p1, f); controls.target.lerpVectors(tween.t0, tween.t1, f); if (tween.u >= 1) tween = null; }
    if (FOLLOW) {
      const r = FOLLOW.car.c.root, yaw = r.rotation.y, want = V(r.position.x - Math.cos(yaw) * 0.62, r.position.y + 0.3, r.position.z + Math.sin(yaw) * 0.62);
      camera.position.copy(want); controls.target.set(r.position.x + Math.cos(yaw) * 0.3, r.position.y + 0.02, r.position.z - Math.sin(yaw) * 0.3);
    }
    controls.update();
    updateLine(t); updateMolding(t); updateSMT(t); updateMisc(t, paused ? 0 : dt);
    if (SIM.frame % 3 === 0) renderDR(t);
    if (SIM.frame % 6 === 0) cfdScreen();
    if (SIM.frame % 15 === 0) hudUpdate();
    renderer.render(scene, camera); updateLabels(camera);
  } else if (VIEW === 'studio') {
    if (S.spin) turn.rotation.y += dt * 0.35;
    sCtl.update(); turn.updateMatrixWorld(true);
    renderer.render(studio, sCam); updateLabels(sCam);
  } else if (VIEW === 'cfd') { if (SIM.frame % 2 === 0) cfdDraw(); }
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  for (const c of [camera, sCam]) { c.aspect = innerWidth / innerHeight; c.updateProjectionMatrix(); }
  fitStudio();
});
addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('show'); });
// deep links: ?view=studio&cam=8&t=120
{
  const q = new URLSearchParams(location.search);
  if (q.get('t')) SIM.t = +q.get('t');
  if (q.get('cam')) goCam(+q.get('cam'), true);
  setView(q.get('view') || 'campus');
}
window.__sim = { camera, controls, POOL, TRACK_CARS, SIM, setView, goCam, LBM, CFDUI, COST, selectPart, S, applyExplode, updateCG, pause: v => paused = v, get view() { return VIEW; } };
event('MFG', `1 直 稼働開始：組立ライン A10–A90・成形 6 台・SMT（${PHASE.id} 量産試作ロット）`);
hudUpdate();
requestAnimationFrame(() => { document.getElementById('load').style.display = 'none'; frame(); });
