<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VELO-32 設計開発事務所＆製造ライン — デジタルツイン</title>
<style>
:root{--bg:#0e1115;--bg2:#151a21;--panel:rgba(18,22,29,.86);--line:rgba(255,255,255,.09);--txt:#e8ecf1;--mut:#909aa6;--acc:#ff8a3d;--blue:#3987e5;--ok:#3ddc84;--warn:#fab219;--bad:#ff5a52;--srf:#1b2129}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;overflow:hidden;font-size:13px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px}
button{font:inherit;font-size:12px;color:var(--txt);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:7px 10px;white-space:nowrap;cursor:pointer}
button.on{background:var(--acc);color:#111;border-color:transparent;font-weight:700}
select,input[type=range]{font:inherit;color:var(--txt);background:#222832;border:1px solid var(--line);border-radius:8px;padding:5px}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(#0e1115f2,#0e1115cc);border-bottom:1px solid var(--line)}
#brand{display:flex;flex-direction:column;line-height:1.15;min-width:max-content}
#brand b{font-size:13px;letter-spacing:.04em}#brand span{font-size:10px;color:var(--mut)}
#tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1}#tabs::-webkit-scrollbar{display:none}
.live{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:#d7262e;color:#fff;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.3}}
/* campus HUD */
#hud{position:fixed;left:10px;top:62px;z-index:10;padding:9px 11px;width:292px}
#hud h3{margin:0 0 6px;font-size:11px;color:var(--mut);letter-spacing:.06em;font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}.kv span{color:var(--mut);white-space:nowrap}.kv b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
#ticker{position:fixed;left:10px;bottom:64px;z-index:10;width:min(470px,calc(100vw - 20px));padding:8px 10px;font-size:11.5px;max-height:162px;overflow:hidden}
#ticker div{display:flex;gap:7px;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#ticker i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:4px}
#ticker em{font-style:normal;color:var(--mut);flex:none;font-variant-numeric:tabular-nums}
#cams{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));z-index:10;display:flex;gap:5px;padding:6px;overflow-x:auto;max-width:calc(100vw - 16px);scrollbar-width:none}#cams::-webkit-scrollbar{display:none}
.label{position:fixed;left:0;top:0;pointer-events:none;font-size:11px;font-weight:600;color:#fff;background:rgba(10,12,16,.74);border:1px solid rgba(255,255,255,.14);padding:2px 7px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-100%);z-index:4}
.label.dept{pointer-events:auto;cursor:pointer;background:rgba(57,135,229,.85);border:none}
.label.small{font-size:10px;background:rgba(255,138,61,.88);color:#111;border:none}
/* design studio */
#ds{position:fixed;inset:56px 0 0 0;z-index:8;pointer-events:none;display:none}
#ds.show{display:block}
#dsL,#dsR{position:absolute;top:8px;bottom:8px;width:300px;pointer-events:auto;overflow:auto;padding:10px}
#dsL{left:8px}#dsR{right:8px;width:330px}
#dsBar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;pointer-events:auto;display:flex;gap:6px;align-items:center;padding:7px 10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 680px)}
.sec{font-size:10.5px;color:var(--mut);letter-spacing:.06em;margin:10px 0 4px;font-weight:600;text-transform:none}
.bomrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;padding:4px 6px;border-radius:7px;cursor:pointer;align-items:center}
.bomrow:hover{background:rgba(255,255,255,.05)}.bomrow.sel{background:rgba(255,138,61,.2)}
.bomrow small{color:var(--mut);font-size:10px;display:block}
.tag{font-size:9.5px;border-radius:5px;padding:0 5px;line-height:16px;white-space:nowrap}
.tag.in{background:rgba(57,135,229,.22);color:#8cbcf5}.tag.buy{background:rgba(255,255,255,.08);color:var(--mut)}
.tag.cc{background:rgba(255,90,82,.2);color:#ff9a93}.tag.sc{background:rgba(250,178,25,.2);color:#ffd27a}
.card{font-size:12px;line-height:1.55}.card h2{font-size:15px;margin:0 0 2px}.card .pn{color:var(--mut);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:11.5px}td,th{border-bottom:1px solid var(--line);padding:4px 5px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;font-size:10.5px;white-space:nowrap;position:sticky;top:0;background:var(--srf)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chk{display:grid;grid-template-columns:1fr auto auto;gap:4px 8px;font-size:12px}.chk em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut)}
.ok{color:var(--ok)}.ng{color:var(--bad)}.wa{color:var(--warn)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.st.s-ok{background:rgba(61,220,132,.16);color:#7ee8ac}.st.s-run{background:rgba(57,135,229,.2);color:#8cbcf5}.st.s-warn{background:rgba(250,178,25,.18);color:#ffd27a}.st.s-bad{background:rgba(255,90,82,.2);color:#ff9a93}.st.s-none{background:rgba(255,255,255,.07);color:var(--mut)}
/* full pages */
.page{position:fixed;inset:56px 0 0 0;z-index:15;overflow:auto;background:var(--bg);display:none;padding:16px 18px 60px}
.page.show{display:block}
.page h1{font-size:18px;margin:4px 0 2px}.page .lead{color:var(--mut);margin:0 0 14px;max-width:980px;line-height:1.6}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.box{background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.box h2{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px}.box h2 small{color:var(--mut);font-weight:500;font-size:11px}
.wide{grid-column:1/-1}.scroll{overflow:auto;max-height:520px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--srf);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi span{color:var(--mut);font-size:11px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}.kpi em{font-style:normal;font-size:11px;color:var(--mut)}
svg text{font-family:inherit}
#cfdWrap{display:grid;grid-template-columns:1fr 330px;gap:12px}
#cfdCanvas{width:100%;image-rendering:pixelated;border-radius:10px;background:#0b0d10;display:block}
#load{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--bg);color:var(--mut)}#load b{color:var(--txt)}
.disc{font-size:10.5px;color:var(--mut);line-height:1.5}
.vs{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.vs .step{flex:none;width:132px;background:#20262f;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:11px;position:relative}
.vs .step b{display:block;font-size:11.5px;margin-bottom:2px}.vs .step small{color:var(--mut);display:block}
.vs .step .wip{position:absolute;right:6px;top:5px;font-size:10px;color:var(--acc);font-variant-numeric:tabular-nums}
.dept{background:#20262f;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.dept h3{margin:0 0 3px;font-size:13px;display:flex;justify-content:space-between}.dept h3 span{color:var(--mut);font-weight:500;font-size:11px}
.dept p{margin:0 0 5px;color:var(--mut);font-size:11px}
#deptModal{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:80vh;overflow:auto;padding:14px 16px;display:none}#deptModal.show{display:block}
@media (max-width:820px){
  #hud{width:auto;right:10px;top:58px;padding:7px 9px}#hud .opt{display:none}
  #ticker{bottom:60px;max-height:84px;font-size:10.5px}
  #ds{inset:56px 0 0 0}#dsL{display:none}#dsR{top:auto;bottom:0;left:0;right:0;width:auto;height:44vh;border-radius:12px 12px 0 0}
  #dsBar{top:6px;bottom:auto;max-width:calc(100vw - 16px)}
  #cfdWrap{grid-template-columns:1fr}
  .page{padding:12px 10px 60px}
}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><b>VELO WORKS キャンパスを起動中…</b><span id="loadmsg">事務所と工場を配置しています</span></div>
<div id="top">
  <div id="brand"><b>VELO WORKS<span class="live"><i></i>LIVE</span></b><span>VELO-32 KESTREL 設計開発・製造</span></div>
  <div id="tabs">
    <button data-view="campus" class="on">🏢 キャンパス</button>
    <button data-view="studio">🎨 デザインスタジオ</button>
    <button data-view="cfd">🌬 空力 CFD</button>
    <button data-view="process">📐 開発プロセス</button>
    <button data-view="quality">✅ 品質</button>
    <button data-view="scm">📦 SCM・MRP</button>
    <button data-view="cost">💴 原価</button>
    <button data-view="office">🏛 バックオフィス</button>
  </div>
</div>

<div id="hud" class="panel">
  <h3>本日の稼働（デモ再生 ×<span id="hScale">4</span>）</h3>
  <div class="kv">
    <span>組立ライン タクト</span><b id="hTakt">24 s</b>
    <span>完成（今回）</span><b id="hDone">0</b>
    <span class="opt">EOL 直行率</span><b class="opt" id="hFpy">—</b>
    <span class="opt">OEE（組立）</span><b class="opt" id="hOee">—</b>
    <span class="opt">完成品在庫</span><b class="opt" id="hFg">—</b>
    <span class="opt">受注残</span><b class="opt" id="hBl">—</b>
    <span>開発</span><b id="hPhase">—</b>
  </div>
</div>
<div id="ticker" class="panel"></div>
<div id="cams" class="panel"></div>
<div id="deptModal" class="panel"></div>

<div id="ds">
  <div id="dsL" class="panel"></div>
  <div id="dsR" class="panel"></div>
  <div id="dsBar" class="panel">
    <select id="dsVariant"></select>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap">分解 <input id="dsExplode" type="range" min="0" max="100" value="0" style="width:140px"></label>
    <button id="dsEnv" class="on">規則エンベロープ</button>
    <button id="dsCg">重心</button>
    <button id="dsBat">電池（別売）</button>
    <button id="dsSpin">⟳ 回転</button>
  </div>
</div>

<section class="page" id="pg-cfd"></section>
<section class="page" id="pg-process"></section>
<section class="page" id="pg-quality"></section>
<section class="page" id="pg-scm"></section>
<section class="page" id="pg-cost"></section>
<section class="page" id="pg-office"></section>

<script type="module">
/*MAIN*/
</script>
</body>
</html>
